<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="as13 Equipo"/>
<title>as13 Equipo</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh;padding-bottom:80px;}
  .topbar{background:#1a1a1a;padding:14px 16px 10px;position:sticky;top:0;z-index:10;}
  .topbar h1{font-size:17px;font-weight:700;color:#fff;}
  .topbar .sub{font-size:12px;color:#888;margin-top:1px;}
  .sync-dot{width:8px;height:8px;border-radius:99px;display:inline-block;margin-left:6px;vertical-align:middle;}
  .sync-dot.ok{background:#7dca7d;}.sync-dot.sync{background:#f0a500;animation:pulse 1s infinite;}.sync-dot.err{background:#f5a0a0;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e8e8e5;display:flex;z-index:10;}
  .ntab{flex:1;padding:10px 4px 12px;font-size:11px;border:none;background:transparent;color:#999;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;}
  .ntab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .ntab.active{color:#1a1a1a;font-weight:600;}
  .screen{display:none;padding:16px;}.screen.active{display:block;}
  .card{background:#fff;border:1px solid #e8e8e5;border-radius:14px;padding:14px;margin-bottom:12px;}
  .card-title{font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:12px;}
  .gitem{display:flex;align-items:center;gap:8px;background:#f5f5f0;border-radius:9px;padding:9px 11px;margin-bottom:6px;}
  .gnom{flex:1;font-size:14px;}
  .gmonto{font-size:14px;font-weight:600;}
  .gdel{background:none;border:none;cursor:pointer;color:#ccc;font-size:16px;padding:0;line-height:1;}
  .gdel:active{color:#e74c3c;}
  .add-row{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap;}
  .add-row input,.add-row select{height:38px;border-radius:9px;border:1px solid #e0e0da;background:#f5f5f0;color:#1a1a1a;font-size:14px;padding:0 10px;font-family:inherit;}
  .add-row input:first-child{flex:1;min-width:120px;}
  .add-row input.monto{width:100px;}
  .add-row button{height:38px;min-width:38px;padding:0 12px;border-radius:9px;border:none;background:#1a1a1a;color:#fff;cursor:pointer;font-size:20px;}
  .gtotal{display:flex;justify-content:space-between;font-size:13px;font-weight:600;padding:8px 11px;background:#f5f5f0;border-radius:9px;margin-top:6px;color:#555;}
  .save-btn{width:100%;padding:15px;border-radius:12px;border:none;background:#1a1a1a;color:#fff;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;font-family:inherit;}
  .save-btn:active{background:#333;}
  .cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
  .cat-btn{padding:14px 10px;border-radius:12px;border:1.5px solid #e0e0da;background:#fff;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .cat-btn.active{border-color:#1a1a1a;background:#1a1a1a;color:#fff;}
  .cat-btn span{font-size:24px;}
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:500;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;}
  .prov-card{background:#fff;border:1px solid #e8e8e5;border-radius:14px;margin-bottom:10px;overflow:hidden;}
  .prov-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;}
  .prov-nombre{font-size:15px;font-weight:600;}
  .prov-rubro{font-size:11px;color:#999;margin-top:1px;}
  .prov-saldo{text-align:right;}
  .prov-saldo-amt{font-size:15px;font-weight:700;}
  .prov-saldo-amt.deuda{color:#a32d2d;}.prov-saldo-amt.ok{color:#1a6a1a;}
  .prov-saldo-lbl{font-size:10px;color:#999;}
  .prov-body{border-top:1px solid #f0f0ec;padding:12px 14px;display:none;}
  .prov-body.open{display:block;}
  .movrow{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#f5f5f0;border-radius:9px;margin-bottom:5px;}
  .movrow.pago{background:#f0faf0;}.movrow.mercaderia{background:#f5f0ff;}
  .mov-icon{font-size:16px;flex-shrink:0;}
  .mov-info{flex:1;}
  .mov-desc{font-size:13px;font-weight:500;}
  .mov-fecha{font-size:11px;color:#999;}
  .mov-monto{font-size:13px;font-weight:700;}
  .mov-monto.pago{color:#1a6a1a;}.mov-monto.mercaderia{color:#a32d2d;}
  .prov-actions{display:flex;gap:8px;margin-top:10px;}
  .prov-action-btn{flex:1;padding:9px;border-radius:9px;border:1px solid #e0e0da;background:#f5f5f0;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px;}
  .nuevo-prov-btn{width:100%;padding:13px;border-radius:12px;border:2px dashed #e0e0da;background:transparent;font-size:14px;font-weight:500;color:#999;cursor:pointer;font-family:inherit;margin-bottom:12px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:50;display:none;align-items:flex-end;}
  .modal-overlay.open{display:flex;}
  .modal{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px 30px;width:100%;max-height:90vh;overflow-y:auto;}
  .modal-title{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
  .modal-close{background:none;border:none;font-size:22px;color:#999;cursor:pointer;padding:0;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:#999;font-weight:500;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}
  .field input,.field select{width:100%;height:40px;border-radius:9px;border:1px solid #e0e0da;background:#f5f5f0;color:#1a1a1a;font-size:15px;padding:0 12px;font-family:inherit;outline:none;}
  .field select{appearance:none;}
  .modal-btn{width:100%;padding:14px;border-radius:12px;border:none;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:4px;}
  .modal-btn.primary{background:#1a1a1a;color:#fff;}
  .modal-btn.secondary{background:#f5f5f0;color:#1a1a1a;margin-top:8px;}
  .boleta-btns{display:flex;gap:8px;margin-bottom:4px;}
  .boleta-btn{flex:1;padding:10px;border-radius:9px;border:1px solid #e0e0da;background:#f5f5f0;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;}
  .boleta-thumb{width:44px;height:44px;object-fit:cover;border-radius:7px;border:1.5px solid #e0e0da;cursor:pointer;flex-shrink:0;transition:opacity .15s;}
  .boleta-thumb:active{opacity:.7;}
  #visor-boleta{touch-action:none;}
  #visor-img{transform-origin:center center;transition:transform .15s;cursor:zoom-in;user-select:none;}
  #visor-hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.15);color:#fff;font-size:12px;padding:5px 12px;border-radius:99px;pointer-events:none;opacity:1;transition:opacity 1s;}
  .visor-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:200;display:none;align-items:center;justify-content:center;padding:16px;}
  .visor-overlay.open{display:flex;}
  .visor-overlay img{max-width:100%;max-height:90vh;border-radius:12px;}
  .visor-close{position:absolute;top:16px;right:16px;background:#fff;border:none;border-radius:99px;width:32px;height:32px;font-size:18px;cursor:pointer;}
  .loading-screen{position:fixed;inset:0;background:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:500;gap:12px;}
  .loading-screen.hidden{display:none;}
  .loading-spinner{width:36px;height:36px;border:3px solid #333;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .day-total{background:#1a1a1a;color:#fff;border-radius:12px;padding:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
  .day-total-lbl{font-size:12px;color:#888;}
  .day-total-amt{font-size:22px;font-weight:700;}
  .histitem{border-bottom:1px solid #f0f0ec;padding:10px 0;}
  .histitem:last-child{border-bottom:none;}
  .histitem-top{display:flex;justify-content:space-between;align-items:center;}
  .histitem-cat{font-size:13px;font-weight:500;}
  .histitem-monto{font-size:14px;font-weight:700;color:#a32d2d;}
  .histitem-det{font-size:11px;color:#999;margin-top:2px;}
  .badge-vence{display:inline-block;font-size:10px;padding:2px 7px;border-radius:99px;font-weight:600;margin-left:6px;}
  .badge-vence.pronto{background:#fff5f5;color:#c0392b;}.badge-vence.ok{background:#f0faf0;color:#2d8a2d;}
  .alerta-vence{background:#fff5f5;border:1px solid #f5a0a0;border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
  .alerta-vence-info{flex:1;}
  .alerta-vence-prov{font-size:13px;font-weight:600;}
  .alerta-vence-det{font-size:11px;color:#c0392b;margin-top:1px;}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDcKzH--NXXZ9lwjqIefzv86kXPnCxwyEA",
  authDomain: "local-as13.firebaseapp.com",
  projectId: "local-as13",
  storageBucket: "local-as13.firebasestorage.app",
  messagingSenderId: "261122489645",
  appId: "1:261122489645:web:28acc258d75729940667a4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let _proveedores = [], _gastosEquipo = [];
let catSeleccionada = {emoji:'🧴', nombre:'Perfumería/Limpieza'};

function fmt(n){return '$'+Math.round(n).toLocaleString('es-AR');}
function hoyISO(){
  const d=new Date();
  const local=new Date(d.getTime()-d.getTimezoneOffset()*60*1000);
  return local.toISOString().split('T')[0];
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function formatFecha(f){if(!f)return '';const [y,m,d]=f.split('-');const ms=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];return `${parseInt(d)} ${ms[parseInt(m)-1]} ${y}`;}
function diasHasta(f){const hoy=new Date();hoy.setHours(0,0,0,0);const d=new Date(f+'T00:00:00');return Math.round((d-hoy)/(1000*60*60*24));}

function setSyncDot(state){
  const el=document.getElementById('sync-dot');
  if(el) el.className='sync-dot '+state;
}

async function fbSet(col,id,data){
  setSyncDot('sync');
  try{await setDoc(doc(db,col,id),data);setSyncDot('ok');}
  catch(e){setSyncDot('err');throw e;}
}

function getProveedores(){return _proveedores;}
function saveProveedores(p){_proveedores=p;fbSet('datos','proveedores',{lista:p});}
function getGastosEquipo(){return _gastosEquipo;}
function saveGastosEquipo(g){_gastosEquipo=g;fbSet('datos','gastos_equipo',{lista:g});}

// ---- FOTOS EN COLECCIÓN SEPARADA ----
let _fotosCache={};
async function guardarFoto(fotoId,base64){
  await setDoc(doc(db,'fotos',fotoId),{data:base64,ts:Date.now()});
  _fotosCache[fotoId]=base64;
}
async function cargarFoto(fotoId){
  if(_fotosCache[fotoId]) return _fotosCache[fotoId];
  const snap=await getDoc(doc(db,'fotos',fotoId));
  if(snap.exists()){_fotosCache[fotoId]=snap.data().data;return _fotosCache[fotoId];}
  return null;
}
window.abrirFotoMovimiento=async function(fotoId){
  const data=await cargarFoto(fotoId);
  if(data) verBoleta(data);
  else toast('No se pudo cargar la foto');
};
async function cargarThumbnails(){
  document.querySelectorAll('img[id^="fimg-"]').forEach(img=>{
    const fotoId=img.id.replace('fimg-','');
    if(!img.src||img.src===window.location.href){
      cargarFoto(fotoId).then(data=>{if(data) img.src=data;});
    }
  });
}
async function migrarFotosAColeccion(){
  const provs=[..._proveedores];
  let cambio=false;
  const promises=[];
  provs.forEach(p=>{
    (p.movimientos||[]).forEach(m=>{
      if(m.boleta&&m.boleta.startsWith('data:')){
        const fotoId='foto_'+m.id;
        promises.push(guardarFoto(fotoId,m.boleta).then(()=>{
          m.fotoId=fotoId;delete m.boleta;cambio=true;
        }));
      }
    });
  });
  if(promises.length){
    await Promise.all(promises);
    if(cambio) saveProveedores(provs);
  }
}

async function cargarDatos(){
  try{
    const [pr,ge]=await Promise.all([
      getDoc(doc(db,'datos','proveedores')),
      getDoc(doc(db,'datos','gastos_equipo'))
    ]);
    if(pr.exists()) _proveedores=pr.data().lista||[];
    if(ge.exists()) _gastosEquipo=ge.data().lista||[];
    await migrarFotosAColeccion();
    setSyncDot('ok');
    initListeners();
    renderGastosHoy();
    document.getElementById('loading').classList.add('hidden');
  }catch(e){
    setSyncDot('err');
    document.getElementById('loading').classList.add('hidden');
    toast('Error de conexión');
  }
}

function initListeners(){
  onSnapshot(doc(db,'datos','proveedores'),snap=>{
    if(snap.exists()){_proveedores=snap.data().lista||[];if(document.getElementById('screen-proveedores').classList.contains('active'))renderProveedores();}
  });
  onSnapshot(doc(db,'datos','gastos_equipo'),snap=>{
    if(snap.exists()){_gastosEquipo=snap.data().lista||[];renderGastosHoy();}
  });
}

window.goScreen=function(s){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.ntab').forEach(x=>x.classList.remove('active'));
  document.getElementById('screen-'+s).classList.add('active');
  const idx={gastos:0,proveedores:1}[s];
  document.querySelectorAll('.ntab')[idx].classList.add('active');
  if(s==='proveedores') renderProveedores();
};

  btn.classList.add('active');
  catSeleccionada={emoji,nombre};
};

// ---- GASTOS ----
window.guardarGasto=function(){
  const monto=parseFloat(document.getElementById('gasto-monto').value)||0;
  if(!monto){toast('Ingresá el monto');return;}
  const desc=document.getElementById('gasto-desc').value.trim();
  const fecha=document.getElementById('gasto-fecha').value;
  const quien=document.getElementById('gasto-quien').value;
  const foto=window._gastoFotoEquipo||null;
  const g=[...getGastosEquipo(),{
    id:Date.now(),fecha,cat:catSeleccionada.nombre,emoji:catSeleccionada.emoji,desc,monto,quien,foto
  }];
  saveGastosEquipo(g);
  document.getElementById('gasto-monto').value='';
  document.getElementById('gasto-desc').value='';
  clearGastoFotoEquipo();
  toast('✓ Gasto registrado');
};

window.previewGastoFotoEquipo=function(input){
  if(!input.files||!input.files[0])return;
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const MAX=1800;let w=img.width,h=img.height;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
      const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const compressed=canvas.toDataURL('image/jpeg',0.92);
      window._gastoFotoEquipo=compressed;
      document.getElementById('gasto-foto-img').src=compressed;
      document.getElementById('gasto-foto-preview').style.display='block';
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(input.files[0]);
};

window.clearGastoFotoEquipo=function(){
  window._gastoFotoEquipo=null;
  document.getElementById('gasto-foto-preview').style.display='none';
  document.getElementById('gasto-foto-img').src='';
  document.getElementById('gasto-camara').value='';
  document.getElementById('gasto-galeria').value='';
};

window.delGastoEquipo=function(id){
  if(!confirm('¿Eliminar este gasto?'))return;
  saveGastosEquipo(getGastosEquipo().filter(g=>g.id!==id));
};

function renderGastosHoy(){
  const hoy=hoyISO();
  const gastos=getGastosEquipo().filter(g=>g.fecha===hoy);
  const total=gastos.reduce((a,g)=>a+g.monto,0);
  document.getElementById('total-hoy').textContent=fmt(total);
  document.getElementById('cant-hoy').textContent=gastos.length;
  const card=document.getElementById('hist-gastos-card');
  const el=document.getElementById('hist-gastos');
  if(!gastos.length){card.style.display='none';return;}
  card.style.display='block';
  el.innerHTML=gastos.map(g=>`<div class="histitem">
    <div class="histitem-top">
      <span class="histitem-cat">${g.emoji} ${g.cat}</span>
      <span class="histitem-monto">-${fmt(g.monto)}</span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <p class="histitem-det">${g.desc||''}${g.quien?' · '+g.quien:''}</p>
      <div style="display:flex;align-items:center;gap:6px;">
        ${g.foto?`<img src="${g.foto}" class="boleta-thumb" onclick="verBoleta('${g.foto}')" style="width:36px;height:36px;"/>`:''}
        <button onclick="editarGastoEquipo(${g.id})" style="font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid #e0e0da;background:#f5f5f0;color:#999;cursor:pointer;">✏️</button>
        <button class="gdel" onclick="delGastoEquipo(${g.id})">✕</button>
    </div>
  </div>`).join('');
}

function calcSaldo(prov){
  const movs=prov.movimientos||[];
  return movs.filter(m=>m.tipo==='mercaderia'&&!m.liquidado).reduce((a,m)=>a+m.monto,0);
}

let _pagarInstante=false;

window.togglePagarInstante=function(){
  _pagarInstante=!_pagarInstante;

window.abrirMovimiento=function(provId,tipo){
  document.getElementById('mov-prov-id').value=provId;
  document.getElementById('mov-tipo').value=tipo;
  document.getElementById('mov-edit-id').value='';
  document.getElementById('mov-fecha').value=hoyISO();
  document.getElementById('mov-monto').value='';
  document.getElementById('mov-desc').value='';
  _pagarInstante=false;
  const toggle=document.getElementById('mov-pagar-toggle');
  const knob=document.getElementById('mov-pagar-knob');
  if(toggle){toggle.style.background='#e0e0da';knob.style.left='2px';}

    document.getElementById('mov-desc-field').style.display='block';
    document.getElementById('mov-metodo-field').style.display='none';
    document.getElementById('mov-pagar-toggle-field').style.display='block';
  } else {
    document.getElementById('modal-mov-title').textContent='Registrar pago';
    document.getElementById('mov-monto-lbl').textContent='Monto pagado';
    document.getElementById('mov-desc-field').style.display='none';
    document.getElementById('mov-metodo-field').style.display='block';
    document.getElementById('mov-pagar-toggle-field').style.display='none';
  }
  document.getElementById('modal-mov').classList.add('open');
};

window.guardarMovimiento=async function(){
  const provId=parseInt(document.getElementById('mov-prov-id').value);
  const tipo=document.getElementById('mov-tipo').value;
  const fecha=document.getElementById('mov-fecha').value;
  const monto=parseFloat(document.getElementById('mov-monto').value)||0;
  if(!monto){toast('Ingresá el monto');return;}
  const desc=document.getElementById('mov-desc').value.trim();
  const metodo=document.getElementById('mov-metodo').value||null;
  const provs=[...getProveedores()];
  const idx=provs.findIndex(p=>p.id===provId);
  if(idx<0)return;
  const editId=document.getElementById('mov-edit-id').value;
  if(editId){
    const midx=provs[idx].movimientos.findIndex(m=>m.id===parseInt(editId));
    if(midx<0){toast('Error: movimiento no encontrado');return;}
    const movActual=provs[idx].movimientos[midx];
    let fotoId=movActual.fotoId||null;
    if(window._boletaData===null){fotoId=null;}
    else if(window._boletaData){fotoId='foto_'+Date.now();await guardarFoto(fotoId,window._boletaData);}
    provs[idx].movimientos[midx]={...movActual,fecha,monto,desc,metodo,fotoId};
    saveProveedores(provs);clearBoleta();cerrarModal('modal-mov');
    toast('✓ Movimiento actualizado');
  } else {
    if(!provs[idx].movimientos)provs[idx].movimientos=[];
    const movId=Date.now();
    const liquidado=tipo==='mercaderia'&&_pagarInstante;
    const metodoPago=liquidado?document.getElementById('mov-pagar-metodo').value:null;
    let fotoId=null;
    if(window._boletaData){fotoId='foto_'+movId;await guardarFoto(fotoId,window._boletaData);}
    provs[idx].movimientos.unshift({id:movId,tipo,fecha,monto,desc,metodo,fotoId,liquidado,fechaPago:liquidado?fecha:null,metodoPago});
    saveProveedores(provs);clearBoleta();cerrarModal('modal-mov');
    toast(liquidado?'✓ Mercadería registrada y pagada':tipo==='mercaderia'?'✓ Mercadería registrada':'✓ Pago registrado');
  }
};

window.marcarPagadaEquipo=function(provId,movId){
  const provs=getProveedores();
  const idx=provs.findIndex(p=>p.id===provId);
  if(idx<0)return;
  const mIdx=provs[idx].movimientos.findIndex(m=>m.id===movId);
  if(mIdx<0)return;
  provs[idx].movimientos[mIdx].liquidado=true;
  provs[idx].movimientos[mIdx].fechaPago=hoyISO();
  saveProveedores(provs);
  toast('✓ Boleta marcada como pagada');
};

window.editarMovimiento=function(provId,movId){
  const prov=_proveedores.find(p=>p.id===provId);
  if(!prov)return;
  const m=prov.movimientos.find(m=>m.id===movId);
  if(!m)return;
  document.getElementById('mov-prov-id').value=provId;
  document.getElementById('mov-tipo').value=m.tipo;
  document.getElementById('mov-edit-id').value=movId;
  document.getElementById('mov-fecha').value=m.fecha||hoyISO();
  document.getElementById('mov-monto').value=m.monto||'';
  document.getElementById('mov-desc').value=m.desc||'';
  window._boletaData=undefined;
  const preview=document.getElementById('boleta-preview');
  const img=document.getElementById('boleta-img');
  if(m.fotoId){
    img.src='';preview.style.display='block';
    cargarFoto(m.fotoId).then(data=>{if(data) img.src=data;});
  } else {img.src='';preview.style.display='none';}
  document.getElementById('modal-mov-title').textContent='✏️ Editar entrada';
  document.getElementById('mov-monto-lbl').textContent='Monto de la factura';
  document.getElementById('mov-desc-field').style.display='block';
  document.getElementById('mov-metodo-field').style.display='none';
  document.getElementById('mov-pagar-toggle-field').style.display='none';
  document.getElementById('modal-mov').classList.add('open');
};

window.delMovimiento=function(provId,movId){
  if(!confirm('¿Eliminar?'))return;
  const provs=[...getProveedores()];
  const idx=provs.findIndex(p=>p.id===provId);
  if(idx>=0)provs[idx].movimientos=provs[idx].movimientos.filter(m=>m.id!==movId);
  saveProveedores(provs);
};

window.delProveedor=function(provId){
  if(!confirm('¿Eliminar este proveedor?'))return;
  saveProveedores(getProveedores().filter(p=>p.id!==provId));
};

window.toggleProv=function(id){
  const b=document.getElementById('pb-'+id);
  if(b)b.classList.toggle('open');
};

function renderProveedores(){
  const provs=getProveedores();
  const el=document.getElementById('prov-list');
  document.getElementById('alertas-vence').innerHTML='';
  if(!provs.length){el.innerHTML='<div style="text-align:center;padding:2rem;color:#bbb;font-size:14px;">Sin proveedores todavía</div>';return;}

  // Entradas del día — filtrar por cuándo se CARGÓ (id=timestamp), no por la fecha de la boleta
  const hoy=hoyISO();
  const inicioDiaMs=new Date(hoy+'T00:00:00').getTime();
  const entradasHoy=[];
  provs.forEach(p=>{
    (p.movimientos||[]).filter(m=>m.tipo==='mercaderia'&&m.id>=inicioDiaMs).forEach(m=>{
      entradasHoy.push({prov:p.nombre,desc:m.desc||'Mercadería',monto:m.monto,liquidado:m.liquidado,fotoId:m.fotoId,fecha:m.fecha});
    });
  });
  const cardHoy=document.getElementById('card-entradas-hoy');
  const listHoy=document.getElementById('entradas-hoy-list');
  const totalHoy=document.getElementById('entradas-hoy-total');
  if(cardHoy&&listHoy){
    if(entradasHoy.length){
      cardHoy.style.display='block';
      const total=entradasHoy.reduce((a,e)=>a+e.monto,0);
      totalHoy.textContent='-'+fmt(total);
      listHoy.innerHTML=entradasHoy.map(e=>`
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0ec;">
          ${e.boleta?`<img src="${e.boleta}" class="boleta-thumb" onclick="verBoleta('${e.boleta}')" alt="Boleta" style="width:44px;height:44px;"/>`:'<span style="font-size:20px;flex-shrink:0;">📦</span>'}
          <div style="flex:1;">
            <p style="font-size:13px;font-weight:600;color:#1a1a1a;">${e.prov}</p>
            <p style="font-size:11px;color:#999;">${e.desc}${e.fecha&&e.fecha!==hoy?` · <span style="color:#b8860b;">📅 ${formatFecha(e.fecha)}</span>`:''}</p>
          </div>
          <div style="text-align:right;">
            <p style="font-size:13px;font-weight:700;color:#a32d2d;">-${fmt(e.monto)}</p>
            <p style="font-size:10px;color:${e.liquidado?'#2d8a2d':'#b8860b'};">${e.liquidado?'✓ Pagada':'⏳ Pendiente'}</p>
          </div>
        </div>`).join('');
    } else {
      cardHoy.style.display='none';
    }
  }

  el.innerHTML=[...provs].sort((a,b)=>a.nombre.localeCompare(b.nombre,'es')).map(p=>{
    // Mostrar entradas de mercadería — últimos 7 días
    const movs=(p.movimientos||[]).filter(m=>m.tipo==='mercaderia');
    const hace7dias=Date.now()-7*24*60*60*1000;
    const movsRecientes=movs.filter(m=>m.id>=hace7dias).sort((a,b)=>b.id-a.id);
    const movsHoy=movs.filter(m=>m.id>=inicioDiaMs);
    const renderMovRow=(m)=>`
        <div class="movrow mercaderia" style="${m.liquidado?'opacity:0.6;background:#f0faf0;':''}">
          <span class="mov-icon">${m.liquidado?'✅':'📦'}</span>
          <div class="mov-info">
            <p class="mov-desc">${m.desc||'Mercadería'}</p>
            <p class="mov-fecha">${formatFecha(m.fecha)}</p>
            <p style="font-size:10px;color:${m.liquidado?'#2d8a2d':'#b8860b'};font-weight:600;">${m.liquidado?'✓ Pagada':'⏳ Pendiente'}</p>
          </div>
          <div style="display:flex;align-items:center;gap:6px;">
            ${m.fotoId?`<img id="fimg-${m.id}" class="boleta-thumb" onclick="abrirFotoMovimiento('${m.fotoId}')" alt="Boleta"/>`:''}
            <div style="text-align:right;">
              <p class="mov-monto mercaderia">-${fmt(m.monto)}</p>
              <div style="display:flex;gap:4px;margin-top:3px;justify-content:flex-end;">
                ${!m.liquidado?`<button onclick="marcarPagadaEquipo(${p.id},${m.id})" style="font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid #7dca7d;background:#f0faf0;color:#2d8a2d;cursor:pointer;font-weight:600;">✓ Pagar</button>`:''}
                <button onclick="editarMovimiento(${p.id},${m.id})" style="font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid #e0e0da;background:#f5f5f0;color:#999;cursor:pointer;">✏️</button>
                <button class="gdel" onclick="delMovimiento(${p.id},${m.id})">✕</button>
              </div>
            </div>
          </div>
        </div>`;
    const movsHTML=movsRecientes.length
      ? (movsHoy.length?'<p style="font-size:11px;color:#999;font-weight:600;text-transform:uppercase;margin-bottom:6px;">Hoy</p>':'')
        +movsHoy.map(renderMovRow).join('')
        +(movsRecientes.filter(m=>m.id<inicioDiaMs).length
          ?'<p style="font-size:11px;color:#999;font-weight:600;text-transform:uppercase;margin:10px 0 6px;">Días anteriores</p>'
            +movsRecientes.filter(m=>m.id<inicioDiaMs).map(renderMovRow).join('')
          :'')
      : '<p style="font-size:13px;color:#bbb;padding:6px 0;">Sin entradas recientes</p>';
    return `<div class="prov-card">
      <div class="prov-header" onclick="toggleProv(${p.id})">
        <div>
          <p class="prov-nombre">${p.nombre}</p>
          <p class="prov-rubro">${p.rubro}${p.tel?' · '+p.tel:''}</p>
        </div>
        <div style="text-align:right;">
          <p style="font-size:12px;font-weight:600;color:#888;">${movsHoy.length>0?movsHoy.length+' entrada'+(movsHoy.length>1?'s':'')+' hoy':'Sin entradas hoy'}</p>
        </div>
      </div>
      <div class="prov-body" id="pb-${p.id}">
        <p style="font-size:11px;color:#999;text-transform:uppercase;font-weight:600;margin-bottom:7px;">Entradas de hoy</p>
        ${movsHTML}
        <div class="prov-actions" style="margin-top:10px;">
          <button class="prov-action-btn" onclick="abrirMovimiento(${p.id},'mercaderia')">📦 Cargar entrada</button>
        </div>
      </div>
    </div>`;
  }).join('');
  setTimeout(cargarThumbnails,50);
}

function comprimirImagen(file,callback){
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const MAX=file.size>3*1024*1024?1400:1800;
      let w=img.width,h=img.height;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
      const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      let quality=0.92;
      let result=canvas.toDataURL('image/jpeg',quality);
      while(result.length>800*1024&&quality>0.5){quality=Math.round((quality-0.08)*100)/100;result=canvas.toDataURL('image/jpeg',quality);}
      callback(result);
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
window.previewBoleta=function(input){
  if(!input.files||!input.files[0])return;
  comprimirImagen(input.files[0],function(compressed){
    window._boletaData=compressed;
    document.getElementById('boleta-img').src=compressed;
    document.getElementById('boleta-preview').style.display='block';
  });
};
function clearBoleta(){
  window._boletaData=null;
  document.getElementById('boleta-preview').style.display='none';
  document.getElementById('boleta-img').src='';
  document.getElementById('input-camara').value='';
  document.getElementById('input-galeria').value='';
}

// ---- VISOR CON ZOOM ----
(function(){
  let scale=1, lastScale=1, startDist=0;
  let posX=0, posY=0, startX=0, startY=0;
  let isDragging=false, lastTap=0;
  const getImg=()=>document.getElementById('visor-img');
  const getOverlay=()=>document.getElementById('visor-boleta');

  function applyTransform(s,x,y){
    scale=Math.min(Math.max(s,1),5);
    if(scale===1){posX=0;posY=0;}else{posX=x;posY=y;}
    getImg().style.transform=`scale(${scale}) translate(${posX/scale}px,${posY/scale}px)`;
    getImg().style.cursor=scale>1?'grab':'zoom-in';
  }
  function resetZoom(){applyTransform(1,0,0);}

  function onTouchStart(e){
    if(e.touches.length===2){
      startDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      lastScale=scale;e.preventDefault();
    } else if(e.touches.length===1){
      const now=Date.now();
      if(now-lastTap<300){scale===1?applyTransform(2.5,0,0):resetZoom();lastTap=0;}
      else{lastTap=now;if(scale>1){startX=e.touches[0].clientX-posX;startY=e.touches[0].clientY-posY;isDragging=true;}}
      e.stopPropagation();
    }
  }
  function onTouchMove(e){
    if(e.touches.length===2){
      const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      applyTransform(lastScale*(dist/startDist),posX,posY);e.preventDefault();
    } else if(e.touches.length===1&&isDragging&&scale>1){
      posX=e.touches[0].clientX-startX;posY=e.touches[0].clientY-startY;
      applyTransform(scale,posX,posY);e.preventDefault();
    }
  }
  function onTouchEnd(){isDragging=false;}
  function onWheel(e){e.preventDefault();applyTransform(scale*(e.deltaY>0?0.85:1.18),posX,posY);}
  function onOverlayClick(e){if(e.target===getOverlay())cerrarVisor();}
  function onMouseDown(e){if(scale>1){isDragging=true;startX=e.clientX-posX;startY=e.clientY-posY;getImg().style.cursor='grabbing';}}
  function onMouseMove(e){if(isDragging&&scale>1){posX=e.clientX-startX;posY=e.clientY-startY;applyTransform(scale,posX,posY);}}
  function onMouseUp(){isDragging=false;if(scale>1)getImg().style.cursor='grab';}

  window.verBoleta=function(src){
    const img=getImg(),overlay=getOverlay();
    img.src=src;resetZoom();
    overlay.classList.add('open');
    const hint=document.getElementById('visor-hint');
    if(hint){hint.style.opacity='1';setTimeout(()=>hint.style.opacity='0',2500);}
    img.addEventListener('touchstart',onTouchStart,{passive:false});
    img.addEventListener('touchmove',onTouchMove,{passive:false});
    img.addEventListener('touchend',onTouchEnd);
    overlay.addEventListener('wheel',onWheel,{passive:false});
    overlay.addEventListener('click',onOverlayClick);
    img.addEventListener('mousedown',onMouseDown);
    window.addEventListener('mousemove',onMouseMove);
    window.addEventListener('mouseup',onMouseUp);
  };
  window.cerrarVisor=function(){
    const img=getImg(),overlay=getOverlay();
    overlay.classList.remove('open');resetZoom();
    img.removeEventListener('touchstart',onTouchStart);
    img.removeEventListener('touchmove',onTouchMove);
    img.removeEventListener('touchend',onTouchEnd);
    overlay.removeEventListener('wheel',onWheel);
    overlay.removeEventListener('click',onOverlayClick);
    img.removeEventListener('mousedown',onMouseDown);
    window.removeEventListener('mousemove',onMouseMove);
    window.removeEventListener('mouseup',onMouseUp);
  };
})();
window.cerrarModal=function(id){document.getElementById(id).classList.remove('open');};
document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');}));
